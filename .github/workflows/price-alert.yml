name: Price Alert Bot

on:
  schedule:
    # Asumiendo horario de Chile (UTC-4)
    # 12:15 UTC = 08:15 AM Chile
    # 00:15 UTC = 22:15 PM Chile
    - cron: "15 12,0 * * *"

  # Este comando permite ejecutar el bot manualmente desde la web de GitHub con un botón
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Price Checker
        env:
          TZ: "America/Santiago"
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}
          CALLMEBOT_KEY: ${{ secrets.CALLMEBOT_KEY }}
          PRODUCT_QUERY: ${{ secrets.PRODUCT_QUERY }}
          PRICE_LIMIT_USD: ${{ secrets.PRICE_LIMIT_USD }}
          PRICE_LIMIT_CLP: ${{ secrets.PRICE_LIMIT_CLP }}
        run: |
          python run_now.py
